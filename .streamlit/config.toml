# ARCHIVO GENERADO por scripts/generate_theme.py.
# No editar a mano: modifique mltrading/config/tokens.py y vuelva a generarlo.

[theme]
baseRadius = "0.5rem"
showSidebarBorder = true
font = "'Source Sans 3':https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap"
headingFont = "'Newsreader':https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&display=swap"
headingFontSizes = ["2.25rem", "1.75rem", "1.375rem", "1.125rem", "1rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#2F6FDE", "#C96A12", "#1E9C7E", "#8E63C9", "#D0506A", "#77849A"]

[theme.light]
primaryColor = "#1F4FA3"
backgroundColor = "#F8F9FB"
secondaryBackgroundColor = "#EBEEF4"
textColor = "#15202E"
borderColor = "#D3D9E4"

[theme.dark]
primaryColor = "#3D6AD6"
backgroundColor = "#0E1522"
secondaryBackgroundColor = "#172033"
textColor = "#E6EBF4"
borderColor = "#2B3650"

[browser]
gatherUsageStats = false

[client]
# "type" en producción: se ve el tipo de error, no la traza completa ni rutas de archivo.
# Para depurar en local con la traza completa, sin tocar este archivo, ejecute:
# streamlit run streamlit_app.py --client.showErrorDetails=full
showErrorDetails = "type"
